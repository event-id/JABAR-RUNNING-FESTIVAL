<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#780008">
<meta name="robots" content="noindex">
<title>Pendaftaran Berhasil — Jabar Running Festival 2027</title>
<meta name="description" content="Konfirmasi pendaftaran peserta Jabar Running Festival 2027. Data peserta sedang menunggu verifikasi panitia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23a9000a'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Arial,sans-serif'%20font-size='30'%20font-weight='900'%20fill='%23fff'%20text-anchor='middle'%3EJF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#c90012;--gold:#e9b949;--ink:#1b1415;--muted:#7d7170;--line:#f0e4e1;--font:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
::selection{background:rgba(201,0,18,.14)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 16px;background:#f5efec;color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px circle at 90% -5%,rgba(201,0,18,.07),transparent 60%),radial-gradient(520px circle at -8% 60%,rgba(201,0,18,.05),transparent 55%)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.card{width:min(520px,100%);background:#fff;border:1px solid rgba(148,20,25,.08);border-radius:20px;box-shadow:0 30px 70px -22px rgba(80,10,12,.26);overflow:hidden;animation:rise .5s ease both}
.bar{height:6px;background:linear-gradient(90deg,#780008,#c90012 45%,#e52337 75%,var(--gold))}
.inner{padding:32px 30px 30px;text-align:center}
.brand{font-size:10px;font-weight:800;letter-spacing:.3em;color:var(--red)}
.seal{width:92px;height:92px;margin:24px auto 18px;border-radius:50%;background:linear-gradient(135deg,#d51024,#8c000e);display:grid;place-items:center;box-shadow:0 18px 40px rgba(201,0,18,.32),0 0 0 8px rgba(233,185,73,.16);animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.seal svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .55s .4s ease-out forwards}
h1{font-size:clamp(22px,5vw,28px);margin:0 0 8px;letter-spacing:-.02em;text-transform:uppercase;font-weight:800}
.sub{font-size:12.5px;color:var(--muted);margin:0 auto 18px;max-width:400px}
.status{display:inline-block;padding:7px 14px;border-radius:999px;background:#fff4f3;border:1px solid #f6d9d7;color:#a9000b;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;margin-bottom:18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid #f5ece9;font-size:12.5px}
.row:first-child{border-top:0}
.row span{color:var(--muted)}
.row strong{font-weight:700;text-align:right;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;background:linear-gradient(135deg,#fff4f3,#ffeceb);color:#a9000b;font-weight:800;border:1px solid #f6d9d7;border-radius:14px;margin-bottom:22px}
.total strong{font-size:22px;font-variant-numeric:tabular-nums}
.btn{display:inline-block;border:0;border-radius:12px;padding:15px 26px;background:linear-gradient(135deg,#d51024,#8c000e);color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none;box-shadow:0 12px 26px rgba(201,0,18,.3);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(201,0,18,.38);filter:brightness(1.05)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.note{font-size:10.5px;line-height:1.65;color:#827875;background:#f8f4f2;padding:12px 14px;border-radius:12px;border:1px solid #eee3df;margin:20px 0 0}
.note b{color:var(--red)}
@media(max-width:480px){.inner{padding:26px 18px 24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.seal svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="card">
  <div class="bar"></div>
  <div class="inner">
    <div class="brand">JABAR RUNNING FESTIVAL 2027</div>
    <div class="seal" aria-hidden="true"><svg viewBox="0 0 64 64"><polyline points="17 34 28 45 47 22"/></svg></div>
    <h1>Pendaftaran Berhasil</h1>
    <p class="sub">Terima kasih telah mendaftar. Data Anda telah diterima dan akan diverifikasi oleh panitia.</p>
    <div class="status" id="status">Menunggu verifikasi panitia</div>
    <div class="rows" id="rows"></div>
    <div class="total"><span>TOTAL PEMBAYARAN</span><strong id="totalVal">—</strong></div>
    <a class="btn" href="form.html">Daftarkan Peserta Lain</a>
    <p class="note"><b>Catatan:</b> simpan atau tangkap layar halaman ini sebagai bukti pendaftaran Anda.</p>
  </div>
</main>
<script>
(()=>{
"use strict";
const rowsEl=document.getElementById("rows"),totalEl=document.getElementById("totalVal"),statusEl=document.getElementById("status");
let d=null;
try{d=JSON.parse(sessionStorage.getItem("jrfRegistration")||"null");}catch(e){}
const fields=[["Nama peserta","nama"],["Email","email"],["WhatsApp","whatsapp"],["Kategori","kategori"],["Nama BIB","namaBib"],["Size jersey","jersey"],["Bukti pembayaran","namaFileBukti"],["Waktu pendaftaran","waktu"]];
const fmt=new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0});
fields.forEach(([label,key])=>{
  let v=(d&&d[key]&&String(d[key]).length)?String(d[key]):"—";
  if(key==="waktu"&&d&&d.waktu){
    try{v=new Date(d.waktu).toLocaleString("id-ID",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){}
  }
  const row=document.createElement("div");
  row.className="row";
  const s=document.createElement("span");
  s.textContent=label;
  const b=document.createElement("strong");
  b.textContent=v;
  row.append(s,b);
  rowsEl.append(row);
});
totalEl.textContent=(d&&d.total!=null)?fmt.format(d.total):"—";
if(d&&d.status)statusEl.textContent=d.status;
})();
</script>
</body>
</html>
